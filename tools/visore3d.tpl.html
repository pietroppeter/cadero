<title>__TITOLO__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: una sola vista 3D a tutta larghezza, con barra di comandi sotto, come un banco di lavoro */
:root {
  --bg: #e9ecee; --panel: #f7f8f9; --fg: #1d2429; --muted: #5d6870; --line: #c9d0d5;
  --accent: #a8682a; --stage: #dfe3e6; --edge: 0x6b5a45;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161a1d; --panel: #1f2428; --fg: #e6e9eb; --muted: #9aa5ad; --line: #343c42;
  --accent: #e0a161; --stage: #23292d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161a1d; --panel: #1f2428; --fg: #e6e9eb; --muted: #9aa5ad; --line: #343c42;
  --accent: #e0a161; --stage: #23292d; color-scheme: dark }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 28px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 5vw, 40px); letter-spacing: 0.01em; margin: 0; line-height: 1.05; text-wrap: balance; }
.dims { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dims b { color: var(--accent); font-weight: 400; }
.stage { position: relative; width: 100%; height: min(72vh, 680px); min-height: 360px; background: var(--stage);
  border: 1px solid var(--line); border-radius: 6px; overflow: hidden; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.status { position: absolute; left: 12px; bottom: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); pointer-events: none; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; justify-content: flex-start; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group[hidden] { display: none; }
.label { font-family: var(--display); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
button { font: 500 14px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.back { font-size: 14px; } .back a { color: var(--accent); }
.note { color: var(--muted); font-size: 13.5px; max-width: 70ch; margin: 0; }
.tavola { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; display: grid; gap: 8px; }
.tavola h2 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0; letter-spacing: 0.01em; }
.tavola .riga { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tavola svg { display: block; width: 100%; height: auto; border-radius: 4px; }
</style>

<div class="wrap">
__BACK__
  <header>
    <h1>__TITOLO__</h1>
    <div class="dims">__MISURE__</div>
  </header>
  <div class="stage" id="stage"><div class="status" id="status">Caricamento del modello…</div></div>
  <div class="bar">
    <div class="group" role="group" aria-label="Viste">
      <span class="label">Vista</span>
      <button id="v-iniziale" type="button" title="Il punto di vista di partenza">Tre quarti</button>
      <button id="v-dentro" type="button">Dentro</button>
    </div>
    <div class="group" id="g-mobile" role="group" aria-label="Mobile">
      <span class="label">Mobile</span>
      <button id="m-base" type="button" aria-pressed="true">Base</button>
      <button id="m-tavolino" type="button" aria-pressed="false">Con tavolino</button>
      <button id="m-falegnami" type="button" aria-pressed="false" hidden title="Il modello mandato dai falegnami: gli stessi spazi divisi in mobili da costruire">Falegnami</button>
      <button id="m-antina" type="button" aria-pressed="false" hidden title="Un'antina sotto il piano del tavolino che si ribalta a destra: con il tavolino aperto, tocca il piano dietro i cassetti">Antina tavolino</button>
      <button id="m-prese" type="button" aria-pressed="false" title="La scatola con presa, USB-C e interruttore: appesa sotto il primo scaffale o, premuto, appoggiata sul comodino">Prese sul comodino</button>
      <button id="m-risega" type="button" aria-pressed="false" title="Senza i pannelli che rivestono la risega: si vede il muro con la carta da parati">Scopri risega</button>
    </div>
    <div class="group" id="g-modifiche" role="group" aria-label="Modifiche" hidden>
      <span class="label">Modifiche</span>
      <button id="p-tavolino" type="button" aria-pressed="false" title="Il pannellino dei falegnami che esce dalla fessura tra il 3° e il 4° gradino; senza, i gradini si ridistribuiscono">Tavolino</button>
      <button id="p-testata" type="button" aria-pressed="false" title="La testata della libreria alta 58 dal piano letto invece di 32, con due scaffali invece di tre">Testata alta</button>
      <button id="p-risega" type="button" aria-pressed="false" title="Il pannello che copre la risega largo 10 invece di 15.8: la libreria è più profonda (69.3)">Risega stretta</button>
      <button id="p-vani" type="button" aria-pressed="false" title="Le aperture dei vani alti da 41.7 invece di 32.6: ribalte e scatole più alte di 9.1, sotto non cambia niente">Vani alti</button>
    </div>
    <div class="group" id="g-taglio" role="group" aria-label="Taglio del fronte" hidden>
      <span class="label">Taglio</span>
      <button id="f-croce" type="button" aria-pressed="true" title="I quattro pannelli dei falegnami 112.5 × 156.8, la fascia in alto e le spalle">A croce</button>
      <button id="f-verticali" type="button" aria-pressed="false" title="Le spalle e due metà da cima a fondo: tutto verticale, 4 pezzi">4 verticali</button>
      <button id="f-sei" type="button" aria-pressed="false" title="Le spalle, una fascia sotto (fino a 109) e una sopra (da 259), due pezzi verticali in mezzo: 6 pezzi">6 pezzi</button>
      <button id="f-tre" type="button" aria-pressed="false" title="Tre pezzi su tutta la larghezza, senza le spalle: sotto fino a 109 (poco sopra i gradini), sopra due pezzi alti uguali 236.8 × 105.3">3 orizzontali</button>
      <button id="f-altov" type="button" aria-pressed="false" hidden title="La venatura verticale nel solo pezzo in alto, gli altri orizzontali">Alto verticale</button>
    </div>
    <div class="group" role="group" aria-label="Multistrato">
      <span class="label">Multistrato</span>
      <button id="t-betulla" type="button" aria-pressed="true" title="I pannelli in multistrato di betulla, con la venatura e gli strati sul bordo">Betulla</button>
      <button id="t-venatura" type="button" aria-pressed="false" title="Premuto: tocca un pannello per girarne la venatura, orizzontale o verticale">Gira venatura</button>
    </div>
    <div class="group" role="group" aria-label="Apertura">
      <span class="label">Apertura</span>
      <button id="t-apri" type="button">Apri tutto</button>
      <button id="t-chiudi" type="button">Chiudi tutto</button>
    </div>
    <div class="group" role="group" aria-label="Nascondi">
      <span class="label">Nascondi</span>
      <button id="t-carta" type="button" aria-pressed="false" hidden>Carta da parati</button>
      <button id="t-fronte" type="button" aria-pressed="false">Pannello frontale</button>
    </div>
    <div class="group" role="group" aria-label="Speciale">
      <span class="label">Speciale</span>
      <button id="t-esploso" type="button" aria-pressed="false">Esploso</button>
    </div>
  </div>
  <section class="tavola" aria-label="La tavola">
    <div class="riga"><h2>La tavola</h2><button type="button" id="scarica-tavola">Scarica SVG</button></div>
    __TAVOLA__
    <div class="misure">__DIDASCALIA__</div>
  </section>
  <p class="note">__NOTA__</p>
</div>

<!-- three.js è un modulo ES, copiato nel repository (vendor/three, messo in
     three/ accanto alla pagina: niente CDN): lo si carica con un importmap e lo si mette in
     window.THREE, insieme a OrbitControls, per il codice Nim compilato in JS
     (uno script normale, sotto). L'evento "three-pronto" fa partire il visore. -->
<script type="importmap">
{"imports": {"three": "./three/build/three.module.min.js",
  "three/addons/": "./three/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window.THREE = { ...THREE, OrbitControls };
window.dispatchEvent(new Event('three-pronto'));
</script>
__SCRIPT__
