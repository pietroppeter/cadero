name: test e documentazione

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # nimib usa std/re, che richiede libpcre3: non c'è più da Ubuntu 26.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dipendenze
        run: |
          sudo apt-get update && sudo apt-get install -y libpcre3
          nimble install -y nimib
      - name: Test
        run: nim c -r tests/test_parete.nim
      - name: Documenti nimib e visore 3D
        run: |
          nim r docsrc/index.nim
          nim r docsrc/parete_nicchia.nim
          nim r docsrc/come_funziona.nim
          nim r tools/visore3d.nim docs/visore3d.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
