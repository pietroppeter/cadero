name: test e documentazione

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']    # README e AGENTS non cambiano il sito
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # nimib usa std/re, che richiede libpcre3: non c'è più da Ubuntu 26.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # i pacchetti nimble (nimib e dipendenze) cambiano solo con il .nimble
      - uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-${{ hashFiles('*.nimble') }}
      # la cache di compilazione di Nim: il C di stdlib e nimib non cambia da
      # un run all'altro, Nim ricompila solo quello che è cambiato
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nim
          key: nimcache-${{ runner.os }}-${{ github.sha }}
          restore-keys: nimcache-${{ runner.os }}-
      - name: Dipendenze
        run: |
          # apt-get update costa decine di secondi: solo se libpcre3 manca
          dpkg -s libpcre3 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libpcre3; }
          nimble path nimib >/dev/null 2>&1 || nimble install -y nimib
      - name: Test
        run: nim c -r --hints:off tests/test_parete.nim
      - name: Documenti nimib e visore 3D
        # un solo binario per tutti i documenti (docsrc/all_docs.nim)
        run: nim r --hints:off docsrc/all_docs.nim
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
